<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSE Cutoffs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: rgb(25, 25, 25); --dim: rgba(255,255,255,.42); --line: rgba(255,255,255,.1); --hot: 255, 82, 56; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    padding: 16px 20px;
    display: flex; justify-content: center;
    color: #fff; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card { width: 100%; max-width: 860px; }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  h1 { font-size: 14px; font-weight: 600; color: rgba(255,255,255,.85); }

  .toggle { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 8px; }
  .toggle button {
    appearance: none; border: 0; background: none; color: var(--dim); cursor: pointer;
    font: 500 12px "Inter", sans-serif; padding: 5px 12px; border-radius: 6px; transition: color .15s, background .15s;
  }
  .toggle button:hover { color: #fff; }
  .toggle button[aria-pressed="true"] { color: #fff; background: rgba(255,255,255,.1); }

  .head, .r {
    display: grid; align-items: center; column-gap: 16px;
    grid-template-columns: minmax(120px, 1.5fr) 74px 74px 120px 84px;
  }
  .head { padding: 0 0 10px; font-size: 11px; font-weight: 500; letter-spacing: .02em; color: var(--dim); border-bottom: 1px solid var(--line); }
  .head > :not(:first-child), .r > :not(:first-child) { text-align: right; }

  .r { padding: 14px 0 0; position: relative; }
  .inst { font-size: 14px; font-weight: 600; color: rgba(255,255,255,.9); }
  #rows { padding-bottom: 14px; }
  .bar { grid-column: 1 / -1; height: 1px; margin-top: 11px; background: rgba(255,255,255,.1); }
  .bar i { display: block; height: 100%; background: var(--c, #fff); transform-origin: left; transform: scaleX(var(--w, 0)); transition: transform .5s cubic-bezier(.2,.7,.2,1), background .3s; }
  .num { font-size: 14px; color: rgba(255,255,255,.8); }
  .num.faint { color: var(--dim); }
  .marks { font-size: 20px; font-weight: 700; letter-spacing: -.03em; color: var(--c, #fff); transition: color .3s; }
  .marks small { font-size: 11px; font-weight: 500; letter-spacing: 0; color: var(--dim); margin-left: 1px; }
  .pct { font-size: 13px; color: rgba(255,255,255,.8); }
  .pct b { font-weight: 500; color: #fff; }

  .iiit { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: baseline; }
  .stats { display: flex; gap: clamp(18px, 3.5vw, 40px); justify-content: flex-end; flex-wrap: wrap; }
  .stat { text-align: right; }
  .stat .v { font-size: 20px; font-weight: 700; letter-spacing: -.03em; }
  .stat .k { margin-top: 3px; font-size: 11px; color: var(--dim); }


  @media (max-width: 680px) {
    body { padding: 16px; }
    .head, .r { grid-template-columns: minmax(84px, 1.4fr) 44px 46px 78px 66px; column-gap: 8px; }
    .inst { font-size: 13px; }
    .marks { font-size: 18px; }
    .iiit { grid-template-columns: 1fr; }
    .stats, .stat { justify-content: flex-start; text-align: left; }
  }
</style>
</head>
<body>
<div class="card">
  <header>
    <div>
      <h1>CSE closing ranks</h1>
    </div>
    <div class="toggle" role="group" aria-label="Category">
      <button type="button" data-cat="gen" aria-pressed="true">General</button>
      <button type="button" data-cat="obc" aria-pressed="false">OBC-NCL</button>
    </div>
  </header>

  <div class="head" id="head"></div>
  <div id="rows"></div>

  <div id="backups"></div>
</div>

<script>
  // gen/obc: [JoSAA last-round closing rank 2025, 2026], marks needed (official 2025 marks-vs-rank tables)
  const data = [
    { n: 'IIT Bombay',    gen: { r: [66, 67],     m: 283, adv: '99.96' }, obc: { r: [54, 62],   m: 234, adv: '~99.72' } },
    { n: 'IIT Delhi',     gen: { r: [126, 128],   m: 272, adv: '99.93' }, obc: { r: [91, 108],  m: 223, adv: '~99.62' } },
    { n: 'IIT Madras',    gen: { r: [171, 151],   m: 269, adv: '99.92' }, obc: { r: [87, 96],   m: 226, adv: '~99.66' } },
    { n: 'IIT Kanpur',    gen: { r: [271, 283],   m: 252, adv: '99.84' }, obc: { r: [142, 158], m: 210, adv: '~99.47' } },
    { n: 'IIT Kharagpur', gen: { r: [466, 509],   m: 233, adv: '99.72' }, obc: { r: [212, 258], m: 193, adv: '~99.19' } },
    { n: 'IIT Roorkee',   gen: { r: [592, 587],   m: 228, adv: '99.67' }, obc: { r: [253, 312], m: 187, adv: '~99.04' } },
    { n: 'IIT Guwahati',  gen: { r: [792, 822],   m: 215, adv: '99.54' }, obc: { r: [336, 392], m: 178, adv: '~98.81' } },
  ];
  // Backups: IIIT-H has no reservation, so it is the same in both views
  const iiith = { rank: '866–1004', pct: '99.93–99.94', marks: '~240–250' };
  const backups = [
    { n: 'IIIT Hyderabad CSE', gen: iiith, obc: iiith },
    { n: 'NIT Calicut CSE',
      gen: { rank: '8428–8814', pct: '99.45–99.47', marks: '~173–190' },
      obc: { rank: '4321',      pct: '~98.95',      marks: '~153–169' } },
  ];
  const backupsEl = document.getElementById('backups');
  const lo = 175, hi = 285;                    // marks range driving colour (white -> hot)
  const mix = (a, b, u) => Math.round(a + (b - a) * u);
  const rows = document.getElementById('rows');
  const head = document.getElementById('head');

  const avg = t => { const n = t.match(/\d+/g).map(Number); return n.reduce((a, b) => a + b, 0) / n.length; };

  function colour(m) {
    const u = Math.min(1, Math.max(0, (m - lo) / (hi - lo)));
    return `rgb(255,${mix(255, 82, u)},${mix(255, 56, u)})`;
  }

  function render(cat) {
    head.innerHTML = `
      <div>Institute</div><div>2025</div><div>2026</div>
      <div>Percentile</div>
      <div>Marks</div>`;
    rows.innerHTML = data.map(d => {
      const c = d[cat], col = colour(c.m);
      const pct = `<div class="pct mono"><b>${c.adv}</b></div>`;
      return `
      <div class="r" style="--c:${col}; --w:${(c.m / 360).toFixed(4)}">
        <div class="inst">${d.n}</div>
        <div class="num mono">${c.r[0]}</div>
        <div class="num mono ${c.r[1] ? '' : 'faint'}">${c.r[1] ?? '–'}</div>
        ${pct}
        <div class="marks mono">${c.m}<small>+</small></div>
        <div class="bar"><i></i></div>
      </div>`;
    }).join('');
    backupsEl.innerHTML = backups.map(b => {
      const c = b[cat];
      return `
      <div class="iiit">
        <div class="inst">${b.n}</div>
        <div class="stats mono">
          <div class="stat"><div class="v">${c.rank}</div><div class="k">rank</div></div>
          <div class="stat"><div class="v">${c.pct}</div><div class="k">percentile</div></div>
          <div class="stat"><div class="v" style="color:${colour(avg(c.marks))}">${c.marks}</div><div class="k">marks</div></div>
        </div>
      </div>`;
    }).join('');
  }

  const buttons = document.querySelectorAll('.toggle button');
  buttons.forEach(b => b.addEventListener('click', () => {
    buttons.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render(b.dataset.cat);
  }));
  render('gen');
</script>
</body>
</html>
