<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEE Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg: rgb(25, 25, 25); --dim: rgba(255,255,255,.42); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    min-height: 100vh; padding: 48px 24px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .row {
    display: flex; justify-content: center; align-items: flex-start;
    gap: clamp(28px, 5vw, 64px);
  }
  .exam { --fs: clamp(56px, 10vw, 128px); display: flex; flex-direction: column; align-items: center; text-align: center; }

  .name { font-size: 14px; font-weight: 600; color: rgba(255,255,255,.85); }
  .date { margin-top: 4px; font-size: 12px; color: var(--dim); }
  .date em { font-style: normal; }

  .days {
    margin-top: 16px;
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: var(--fs); font-weight: 700; line-height: 1;
    letter-spacing: -.05em; font-variant-numeric: tabular-nums;
    color: var(--c, #fff);
    animation: breathe var(--pulse, 4s) ease-in-out infinite;
  }

  .wrap { display: flex; flex-direction: column; align-items: stretch; }
  .bar { height: 1px; margin-top: 40px; background: rgba(255,255,255,.14); }
  .bar i { display: block; height: 100%; width: 100%; background: rgba(255,255,255,.8); transform-origin: left; transform: scaleX(0); }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: calc(1 - var(--amp, 0)); }
  }
  @media (prefers-reduced-motion: reduce) { .days { animation: none; } }

  @media (max-width: 760px) {
    .row { flex-direction: column; align-items: center; gap: 48px; }
    .exam { --fs: 80px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <main class="row" id="row"></main>
  <div class="bar"><i></i></div>
</div>

<script>
  const exams = [
    { name: 'JEE Mains 1',  date: 'Jan 20', note: '',          on: [2027, 0, 20] },
    { name: 'JEE Mains 2',  date: 'Apr 2',  note: '',          on: [2027, 3, 2] },
    { name: 'JEE Advanced', date: 'May 16', note: ' · tentative', on: [2027, 4, 16] },
  ];
  const row = document.getElementById('row');
  const bar = document.querySelector('.bar i');

  // Calendar days, flipping at local midnight
  const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const daysLeft = on => Math.max(0, Math.round((new Date(...on) - dayStart(new Date())) / 864e5));

  const els = exams.map(e => {
    const days = daysLeft(e.on);
    // urgency 0 (>=180 days out) .. 1 (exam day): drives colour, pulse speed and depth
    const u = Math.min(1, Math.max(0, 1 - days / 180));
    const mix = (a, b) => Math.round(a + (b - a) * u);
    const el = document.createElement('section');
    el.className = 'exam';
    el.style.setProperty('--c', `rgb(255,${mix(255, 82)},${mix(255, 56)})`);
    el.style.setProperty('--pulse', (4.2 - u * 3.2).toFixed(2) + 's');
    el.style.setProperty('--amp', (u * 0.55).toFixed(2));
    el.innerHTML = `
      <div class="name">${e.name}</div>
      <div class="date">${e.date}${e.note}</div>
      <div class="days"></div>`;
    row.appendChild(el);
    return { on: e.on, d: el.querySelector('.days') };
  });

  function render() {
    for (const x of els) x.d.textContent = String(daysLeft(x.on)).padStart(3, '0');
    const now = new Date(), start = dayStart(now);
    const next = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1);
    bar.style.transform = `scaleX(${((now - start) / (next - start)).toFixed(5)})`;
  }
  render();
  setInterval(render, 30000);
</script>
</body>
</html>
