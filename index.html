<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notion Date Widget</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #37352f;
            --text-muted: rgba(55, 53, 47, 0.65);
            --border-color: rgba(55, 53, 47, 0.09);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #191919;
                --text-main: rgba(255, 255, 255, 0.9);
                --text-muted: rgba(255, 255, 255, 0.44);
                --border-color: rgba(255, 255, 255, 0.09);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            color: var(--text-main);
            overflow: hidden;
        }

        .widget-container {
            padding: 12px;
            display: inline-block; /* Only takes up as much space as needed */
        }

        .date-text {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .week-text {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Small divider dot for a cleaner look */
        .week-text::before {
            content: "";
            width: 4px;
            height: 4px;
            background-color: var(--border-color);
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div id="date" class="date-text">...</div>
        <div id="week" class="week-text">Week --</div>
    </div>

    <script>
        function updateDate() {
            const now = new Date();
            
            const dateOptions = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', dateOptions);

            // ISO Week Calculation
            const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            
            document.getElementById('week').innerText = `Week ${weekNo}`;
        }

        updateDate();
        setInterval(updateDate, 60000);
    </script>
</body>
</html>
