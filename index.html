<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JEE Countdown</title>
<style>
  html, body {
    margin: 0;
    background: rgb(25, 25, 25);
    color: #fff;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #widget {
    display: flex;
    flex-direction: row;
    justify-content: center;
    gap: 56px;
    padding: 16px;
    text-align: center;
  }
  .label {
    font-size: 14px;
    opacity: 0.7;
    margin-bottom: 4px;
  }
  .time {
    font-size: 24px;
    white-space: pre;
  }
</style>
</head>
<body>
<div id="widget"></div>

<script>
  // Times are pinned to IST (+05:30) so the countdown is right on any device.
  const EVENTS = [
    { name: "JEE Mains 1",   date: "2027-01-22T00:00:00+05:30", tentative: false },
    { name: "JEE Mains 2",   date: "2027-04-04T00:00:00+05:30", tentative: true  },
    { name: "JEE Advanced",  date: "2027-05-17T00:00:00+05:30", tentative: true  },
  ];

  const widget = document.getElementById("widget");

  // Build the DOM once; only the numbers change each tick.
  const timeEls = EVENTS.map(ev => {
    const block = document.createElement("div");
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = ev.name + (ev.tentative ? " (tentative)" : "");
    const time = document.createElement("div");
    time.className = "time";
    block.append(label, time);
    widget.append(block);
    return time;
  });

  function format(ms) {
    if (ms <= 0) return "Started";
    const s = Math.floor(ms / 1000);
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    const pad = n => String(n).padStart(2, "0");
    return `${d}d ${pad(h)}h ${pad(m)}m ${pad(sec)}s`;
  }

  function tick() {
    const now = Date.now();
    EVENTS.forEach((ev, i) => {
      timeEls[i].textContent = format(new Date(ev.date) - now);
    });
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
